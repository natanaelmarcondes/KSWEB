<div class="app-shell" [class.mobile-menu-open]="menuMobileAberto()">
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">KS</div>

        <div class="brand-text">
          <strong>KSWeb</strong>
          <span>KeySolution</span>
        </div>
      </div>

      <button
        type="button"
        class="sidebar-close"
        aria-label="Fechar menu"
        (click)="fecharMenuMobile()"
      >
        ×
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Menu principal">
      <div class="menu-section">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="menu-link root-link"
          (click)="fecharMenuMobile()"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4 11.5L12 5L20 11.5V20H15V14H9V20H4V11.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>Início</span>
        </a>
      </div>

      <div class="menu-section">
        <button
          type="button"
          class="menu-parent"
          [class.active]="menuAtivo('operacional')"
          [class.open]="submenuAberto() === 'operacional'"
          (click)="alternarSubmenu('operacional')"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M7 7H17M7 12H17M7 17H13"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M5 3.5H19C20.1046 3.5 21 4.39543 21 5.5V18.5C21 19.6046 20.1046 20.5 19 20.5H5C3.89543 20.5 3 19.6046 3 18.5V5.5C3 4.39543 3.89543 3.5 5 3.5Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
          </span>

          <span>Operacional</span>
          <span class="chevron"></span>
        </button>

        <div class="submenu" [class.open]="submenuAberto() === 'operacional'">
          <a
            routerLink="/ordens-servico"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Ordens de serviço
          </a>
        </div>
      </div>

      <div class="menu-section">
        <button
          type="button"
          class="menu-parent"
          [class.active]="menuAtivo('cadastros')"
          [class.open]="submenuAberto() === 'cadastros'"
          (click)="alternarSubmenu('cadastros')"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 11C9.65685 11 11 9.65685 11 8C11 6.34315 9.65685 5 8 5C6.34315 5 5 6.34315 5 8C5 9.65685 6.34315 11 8 11Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M3.5 19C3.5 16.5147 5.51472 14.5 8 14.5C10.4853 14.5 12.5 16.5147 12.5 19"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M16 7H21M16 12H21M16 17H21"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>

          <span>Cadastros</span>
          <span class="chevron"></span>
        </button>

        <div class="submenu" [class.open]="submenuAberto() === 'cadastros'">
          <a
            routerLink="/usuarios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Usuários
          </a>

          <a
            routerLink="/setores"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Setores
          </a>

          <a
            routerLink="/status"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Status
          </a>
        </div>
      </div>

      <div class="menu-section">
        <button
          type="button"
          class="menu-parent"
          [class.active]="menuAtivo('sistema')"
          [class.open]="submenuAberto() === 'sistema'"
          (click)="alternarSubmenu('sistema')"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M12 15.5C13.933 15.5 15.5 13.933 15.5 12C15.5 10.067 13.933 8.5 12 8.5C10.067 8.5 8.5 10.067 8.5 12C8.5 13.933 10.067 15.5 12 15.5Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M19.4 15A8.092 8.092 0 0 0 19.5 14L21.2 12.7C21.6 12.4 21.7 11.9 21.5 11.5L19.9 8.7C19.7 8.3 19.2 8.1 18.8 8.3L16.8 9.1C16.3 8.7 15.8 8.4 15.2 8.2L14.9 6.1C14.8 5.6 14.4 5.3 13.9 5.3H10.1C9.6 5.3 9.2 5.6 9.1 6.1L8.8 8.2C8.2 8.4 7.7 8.7 7.2 9.1L5.2 8.3C4.8 8.1 4.3 8.3 4.1 8.7L2.5 11.5C2.3 11.9 2.4 12.4 2.8 12.7L4.5 14A8.092 8.092 0 0 0 4.6 15L2.9 16.3C2.5 16.6 2.4 17.1 2.6 17.5L4.2 20.3C4.4 20.7 4.9 20.9 5.3 20.7L7.3 19.9C7.8 20.3 8.3 20.6 8.9 20.8L9.2 22.9C9.3 23.4 9.7 23.7 10.2 23.7H13.8C14.3 23.7 14.7 23.4 14.8 22.9L15.1 20.8C15.7 20.6 16.2 20.3 16.7 19.9L18.7 20.7C19.1 20.9 19.6 20.7 19.8 20.3L21.4 17.5C21.6 17.1 21.5 16.6 21.1 16.3L19.4 15Z"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linejoin="round"
              />
            </svg>
          </span>

          <span>Sistema</span>
          <span class="chevron"></span>
        </button>

        <div class="submenu" [class.open]="submenuAberto() === 'sistema'">
          <a
            routerLink="/modelo-padrao"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Modelo padrão
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <span>Ambiente</span>
      <strong>Produção</strong>
    </div>
  </aside>

  <button
    type="button"
    class="mobile-backdrop"
    aria-label="Fechar menu"
    (click)="fecharMenuMobile()"
  ></button>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Abrir menu"
          (click)="abrirMenuMobile()"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <div class="topbar-right">
        <div class="topbar-user-card">
          <div class="topbar-user-avatar">
            {{ (usuario()?.nome || 'U').substring(0, 1).toUpperCase() }}
          </div>

          <div class="topbar-user-info">
            <div class="topbar-user-name">
              {{ usuario()?.nome || 'Usuário' }}
            </div>

            <div class="topbar-user-level">
              <strong>{{ usuario()?.nivel || '-' }}</strong>
            </div>
          </div>
        </div>

        <button type="button" class="topbar-logout" (click)="sair()">
          <span class="topbar-logout-text">Sair</span>
        </button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
