<div class="app-shell" [class.mobile-menu-open]="menuMobileAberto()" [class.menu-collapsed]="menuRecolhido()">
  <aside class="sidebar" id="menu-principal">
    <nav class="sidebar-nav" aria-label="Menu principal">
      <div class="menu-section">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="menu-link root-link"
          (click)="fecharMenuMobile()"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M4 11.5L12 5L20 11.5V20H15V14H9V20H4V11.5Z"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>Início</span>
        </a>
      </div>

      <div class="menu-section">
        <a routerLink="/ordens-servico" routerLinkActive="active" ariaCurrentWhenActive="page"
          class="menu-link" (click)="fecharMenuMobile()">
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M7 7H17M7 12H17M7 17H13"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M5 3.5H19C20.1046 3.5 21 4.39543 21 5.5V18.5C21 19.6046 20.1046 20.5 19 20.5H5C3.89543 20.5 3 19.6046 3 18.5V5.5C3 4.39543 3.89543 3.5 5 3.5Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
            </svg>
          </span>
          <span>Ordens de serviço</span>
        </a>
      </div>

      <div class="menu-section">
        <a routerLink="/daily" routerLinkActive="active" ariaCurrentWhenActive="page"
          class="menu-link" (click)="fecharMenuMobile()">
          <span class="menu-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M16 3v4M8 3v4M3 11h18M8 15h3M8 18h6" />
            </svg>
          </span>
          <span>Daily</span>
        </a>
      </div>

      <div class="menu-section">
        <button
          type="button"
          class="menu-parent"
          [class.active]="menuAtivo('cadastros')" [attr.aria-expanded]="submenuAberto() === 'cadastros'"
          [class.open]="submenuAberto() === 'cadastros'"
          (click)="alternarSubmenu('cadastros')"
        >
          <span class="menu-icon">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M8 11C9.65685 11 11 9.65685 11 8C11 6.34315 9.65685 5 8 5C6.34315 5 5 6.34315 5 8C5 9.65685 6.34315 11 8 11Z"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <path
                d="M3.5 19C3.5 16.5147 5.51472 14.5 8 14.5C10.4853 14.5 12.5 16.5147 12.5 19"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
              <path
                d="M16 7H21M16 12H21M16 17H21"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>

          <span>Cadastro</span>
          <span class="chevron"></span>
        </button>

        <div class="submenu" [hidden]="submenuAberto() !== 'cadastros'">
          <a
            routerLink="/usuarios"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Usuários
          </a>

          <a
            routerLink="/setores"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Setores
          </a>

          <a
            routerLink="/status"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            class="submenu-link"
            (click)="fecharMenuMobile()"
          >
            Status
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <span>Keysystems Informática</span>
      <span>© {{ ano }} - Todos os direitos reservados</span>
      <span>KeySolution</span>
    </div>
  </aside>

  <button
    type="button"
    class="mobile-backdrop"
    aria-label="Fechar menu"
    (click)="fecharMenuMobile()"
  ></button>

  <div class="content">
    <header class="topbar">
      <div class="topbar-left">
        <button
          type="button"
          class="mobile-menu-button"
          [attr.aria-label]="menuVisivel() ? 'Recolher menu' : 'Abrir menu'"
          (click)="alternarMenu()" [attr.aria-expanded]="menuVisivel()" aria-controls="menu-principal"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
        <a class="brand" routerLink="/dashboard" aria-label="KeySystems — início">
          <img class="brand-mark" src="logo_key.jpg" alt="KEY" /><strong>KEYSYSTEMS</strong>
        </a>
      </div>

      <div class="topbar-right">
        <div class="topbar-user-card">
          <div class="topbar-user-info">
            <div class="topbar-user-name">
              {{ usuario()?.nome || 'Usuário' }}
            </div>

            <div class="topbar-user-level">
              <strong>{{ usuario()?.nivel || '-' }}</strong>
            </div>
          </div>
        </div>

        <span class="topbar-clock" aria-label="Horário atual">◷ {{ horario() }}</span>
        <button type="button" class="topbar-logout" (click)="sair()" aria-label="Sair" title="Sair">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 4H4v16h5M13 7l5 5-5 5M8 12h12" /></svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
