<main class="login-page">
  <div class="login-shell">
    <section class="login-brand">
      <div class="brand-box">
        <img class="brand-logo" src="logo_key.jpg" alt="KEY" />
        <div class="brand-title">KeySolution</div>
        <div class="brand-subtitle">Keysystems Informatica</div>
      </div>

      <div class="brand-footer">
        <span>Sistema de gestao tecnica</span>
        <strong>Ambiente seguro</strong>
      </div>
    </section>

    <section class="login-card" aria-label="Login KSWeb">
      <div class="login-header">
        <div>
          <h1>Acessar sistema</h1>
        </div>
      </div>

      @if (erro()) {
        <div class="login-alert" role="alert">{{ erro() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="entrar()" class="login-form" autocomplete="off">
        <app-ks-input
          label="E-mail"
          type="email"
          autocomplete="username"
          placeholder="seuemail@keysystems.com.br"
          formControlName="email"
          [erro]="form.controls.email.touched && form.controls.email.invalid ? 'Informe um email valido.' : ''"
        ></app-ks-input>

        <app-ks-input
          label="Senha"
          type="password"
          autocomplete="current-password"
          formControlName="senha"
          [erro]="form.controls.senha.touched && form.controls.senha.invalid ? 'Informe sua senha.' : ''"
        ></app-ks-input>

        <label class="login-remember">
          <input type="checkbox" formControlName="manterConectado" />
          <span>Manter conectado</span>
        </label>

        <app-ks-button tipo="primary" type="submit" [disabled]="carregando()">
          {{ carregando() ? 'Entrando...' : 'Entrar' }}
        </app-ks-button>
      </form>
    </section>
  </div>
</main>
