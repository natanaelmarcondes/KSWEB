<section class="daily-page">
  @if (erro) {
    <div class="alert">{{ erro }}</div>
  }

  <div class="filters-panel">
    <header class="page-header ks-section-title">
      <div>
        <h1>Daily</h1>
      </div>
    </header>

    <div class="filters-actions ks-search-actions">
      <app-ks-button class="ks-create-button" tamanho="small" tipo="success" [disabled]="criando" (acao)="novo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        {{ criando ? 'Criando...' : 'Adicionar' }}
      </app-ks-button>
      <div class="ks-search-buttons">
        <app-ks-button tamanho="small" tipo="secondary" (acao)="atualizar()">Atualizar</app-ks-button>
        <app-ks-button tamanho="small" tipo="primary" (acao)="pesquisar()">Pesquisar</app-ks-button>
      </div>
    </div>
  </div>


        <app-ks-table [loading]="carregando" storageKey="daily" [loadPage]="loadPage" (loadError)="erro = 'Nao foi possivel carregar os registros. Tente atualizar.'" (rowAction)="editar($event)" emptyMessage="Nenhuma daily encontrada.">
  <ng-template ksColumn="ID" field="dailyId" let-item>
    <div class="daily-id">{{ item.dailyId }}</div>
  </ng-template>
  <ng-template ksColumn="Numero" field="dailyNumero" let-item>
    <div class="daily-numero">{{ item.dailyNumero }}</div>
  </ng-template>
  <ng-template ksColumn="Data" field="dailyData" let-item>
    <div>{{ formatarData(item.dailyData) }}</div>
  </ng-template>
  <ng-template ksColumn="Usuario" field="dailyUsuario" let-item>
    <div>{{ item.dailyUsuario || '-' }}</div>
  </ng-template>
  <ng-template ksColumn="Excluir" [width]="82" let-item>
    <app-ks-grid-action tipo="excluir" [carregando]="excluindoId === item.dailyId" (acao)="excluir(item)"></app-ks-grid-action>
  </ng-template>
  <ng-template ksColumn="Editar" [width]="82" let-item>
    <app-ks-grid-action tipo="editar" (acao)="editar(item)"></app-ks-grid-action>
  </ng-template>
</app-ks-table>

</section>
