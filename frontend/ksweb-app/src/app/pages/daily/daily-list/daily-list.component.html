<section class="daily-page">
  <header class="page-header">
    <div>
      <h1>Daily</h1>
      <span>Listagem de registros daily</span>
    </div>

    <app-ks-button tamanho="small" tipo="primary" [disabled]="criando" (acao)="novo()">
      {{ criando ? 'Criando...' : 'Nova Daily' }}
    </app-ks-button>
  </header>

  @if (erro) {
    <div class="alert">{{ erro }}</div>
  }

  <div class="filters-panel">
    <div class="filters-actions">
      <app-ks-button tamanho="small" tipo="secondary" (acao)="atualizar()">Atualizar</app-ks-button>
      <app-ks-button tamanho="small" tipo="primary" (acao)="pesquisar()">Pesquisar</app-ks-button>
    </div>
  </div>

    @if (carregando) {
      <div class="state">Carregando dailies...</div>
    } @else {

        <app-ks-table storageKey="daily" [loadPage]="loadPage" (loadError)="erro = 'Nao foi possivel carregar os registros. Tente atualizar.'" (rowAction)="editar($event)" emptyMessage="Nenhuma daily encontrada.">
  <ng-template ksColumn="ID" field="dailyId" [minWidth]="120" let-item>
    <div class="daily-id">{{ item.dailyId }}</div>
  </ng-template>
  <ng-template ksColumn="Numero" field="dailyNumero" [minWidth]="120" let-item>
    <div class="daily-numero">{{ item.dailyNumero }}</div>
  </ng-template>
  <ng-template ksColumn="Data" field="dailyData" [minWidth]="120" let-item>
    <div>{{ formatarData(item.dailyData) }}</div>
  </ng-template>
  <ng-template ksColumn="Usuario" field="dailyUsuario" [minWidth]="120" let-item>
    <div>{{ item.dailyUsuario || '-' }}</div>
  </ng-template>
  <ng-template ksColumn="Excluir" [width]="82" [minWidth]="76" let-item>
    <app-ks-grid-action tipo="excluir" [carregando]="excluindoId === item.dailyId" (acao)="excluir(item)"></app-ks-grid-action>
  </ng-template>
  <ng-template ksColumn="Editar" [width]="82" [minWidth]="76" let-item>
    <app-ks-grid-action tipo="editar" (acao)="editar(item)"></app-ks-grid-action>
  </ng-template>
</app-ks-table>

    }

</section>
