<section class="setores-page">
  @if (erro) {
    <div class="alert">{{ erro }}</div>
  }

  <div class="filters-panel">
    <header class="page-header ks-section-title">
      <div>
        <h1>Setores</h1>
      </div>
    </header>

    <div class="filters-grid">
      <label>
        <span>Texto</span>
        <input
          type="search"
          [(ngModel)]="filtro.termo"
          placeholder="Codigo ou nome do setor"
          (keyup.enter)="pesquisar()"
        />
      </label>
    </div>

    <div class="filters-actions ks-search-actions">
      <app-ks-button class="ks-create-button"  tamanho="small"  tipo="success"  (acao)="novo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Adicionar</app-ks-button>
      <div class="ks-search-buttons">
        <app-ks-button tamanho="small" tipo="secondary" (acao)="limparFiltros()">Limpar</app-ks-button>
        <app-ks-button tamanho="small" tipo="secondary" (acao)="atualizar()">Atualizar</app-ks-button>
        <app-ks-button tamanho="small" (acao)="pesquisar()">Pesquisar</app-ks-button>
      </div>
    </div>
  </div>


        <app-ks-table [loading]="carregando" storageKey="setores" [rows]="items" emptyMessage="Nenhum setor encontrado.">
  <ng-template ksColumn="Codigo" field="queueId" let-setor>
    <div class="setor-codigo">{{ setor.queueId }}</div>
  </ng-template>
  <ng-template ksColumn="Nome do setor" field="queueName" let-setor>
    <div class="setor-nome">{{ setor.queueName }}</div>
  </ng-template>
  <ng-template ksColumn="Excluir" [width]="82" let-setor>
    <app-ks-grid-action tipo="excluir" [carregando]="excluindoId === setor.queueId" (acao)="excluir(setor)"></app-ks-grid-action>
  </ng-template>
  <ng-template ksColumn="Editar" [width]="82" let-setor>
    <app-ks-grid-action tipo="editar" (acao)="editar(setor)"></app-ks-grid-action>
  </ng-template>
</app-ks-table>

</section>
