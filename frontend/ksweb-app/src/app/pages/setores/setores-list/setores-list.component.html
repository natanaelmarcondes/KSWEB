<section class="setores-page">
  <header class="page-header">
    <div>
      <h1>Setores</h1>
    </div>

    <app-ks-button  tamanho="small"  tipo="primary"  largura="140px"  (acao)="novo()">Novo</app-ks-button>
  </header>

  @if (erro) {
    <div class="alert">{{ erro }}</div>
  }

  <div class="filters-panel">
    <div class="filters-grid">
      <label>
        <span>Texto</span>
        <input
          type="search"
          [(ngModel)]="filtro.termo"
          placeholder="Codigo ou nome do setor"
          (keyup.enter)="pesquisar()"
        />
      </label>
    </div>

    <div class="filters-actions">
      <app-ks-button tamanho="small" tipo="secondary" (acao)="limparFiltros()">Limpar</app-ks-button>
      <app-ks-button tamanho="small" tipo="secondary" (acao)="atualizar()">Atualizar</app-ks-button>
      <app-ks-button tamanho="small" (acao)="pesquisar()">Pesquisar</app-ks-button>
    </div>
  </div>

    @if (carregando) {
      <div class="state">Carregando setores...</div>
    } @else {

        <app-ks-table storageKey="setores" [rows]="items" emptyMessage="Nenhum setor encontrado.">
  <ng-template ksColumn="Codigo" field="queueId" [minWidth]="120" let-setor>
    <div class="setor-codigo">{{ setor.queueId }}</div>
  </ng-template>
  <ng-template ksColumn="Nome do setor" field="queueName" [minWidth]="120" let-setor>
    <div class="setor-nome">{{ setor.queueName }}</div>
  </ng-template>
  <ng-template ksColumn="Excluir" [width]="82" [minWidth]="76" let-setor>
    <app-ks-grid-action tipo="excluir" [carregando]="excluindoId === setor.queueId" (acao)="excluir(setor)"></app-ks-grid-action>
  </ng-template>
  <ng-template ksColumn="Editar" [width]="82" [minWidth]="76" let-setor>
    <app-ks-grid-action tipo="editar" (acao)="editar(setor)"></app-ks-grid-action>
  </ng-template>
</app-ks-table>

    }

</section>
