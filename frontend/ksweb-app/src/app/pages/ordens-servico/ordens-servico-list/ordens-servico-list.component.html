<section class="ordens-page">
  @if (erro) {
    <div class="alert">{{ erro }}</div>
  }

  <div class="filters-panel">
    <header class="page-header ks-section-title">
      <div>
        <h1>Ordens de servico</h1>
      </div>
    </header>

    <div class="filters-grid">
      <label>
        <span>Numero</span>
        <input type="search" [(ngModel)]="filtro.numero" placeholder="O.S" (keyup.enter)="pesquisar()" />
      </label>

      <label>
        <span>Texto</span>
        <input type="search" [(ngModel)]="filtro.texto" placeholder="Titulo da O.S" (keyup.enter)="pesquisar()" />
      </label>

      <label class="multiselect-field">
        <span>Status</span>
        <div class="multiselect" [class.open]="statusDropdownAberto">
          <button type="button" class="multiselect-trigger" (click)="alternarStatusDropdown($event)">
            <span>{{ statusSelecionadosResumo }}</span>
            <span class="multiselect-arrow">v</span>
          </button>

          @if (statusDropdownAberto) {
            <div class="multiselect-menu" (click)="$event.stopPropagation()">
              @for (status of statusOptions; track status.statusId) {
                <label class="multiselect-option">
                  <input
                    type="checkbox"
                    [checked]="statusSelecionado(status.statusName)"
                    (change)="alternarStatus(status.statusName)"
                  />
                  <span>{{ status.statusName }}</span>
                </label>
              } @empty {
                <div class="multiselect-empty">Nenhum status disponivel.</div>
              }
            </div>
          }
        </div>
      </label>

      <label>
        <span>Filtrar por</span>
        <select [(ngModel)]="filtro.filtrarPor" (change)="aoSelecionarFiltroPor()">
          <option value="solicitante">Solicitante</option>
          <option value="criadoPor">Criado por</option>
          <option value="responsavel">Responsável</option>
        </select>
      </label>

      <label class="autocomplete-field">
        <span>Pessoa</span>
        <div class="autocomplete">
          <input
            type="search"
            [(ngModel)]="filtro.filtroUsuarioNome"
            placeholder="Nome do usuario"
            autocomplete="off"
            (focus)="abrirPessoaDropdown()"
            (input)="aoDigitarPessoa()"
            (keyup.enter)="pesquisar()"
          />

          @if (pessoaDropdownAberto) {
            <div class="autocomplete-menu">
              @for (usuario of usuariosFiltrados; track usuario.value) {
                <button type="button" class="autocomplete-option" (click)="selecionarPessoa(usuario)">
                  {{ usuario.label }}
                </button>
              } @empty {
                <div class="autocomplete-empty">Nenhum usuario encontrado.</div>
              }
            </div>
          }
        </div>
      </label>
    </div>

    <div class="filters-actions ks-search-actions">
      <app-ks-button class="ks-create-button" tamanho="small" tipo="success" (acao)="novo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Adicionar</app-ks-button>
      <div class="ks-search-buttons">
        <app-ks-button tamanho="small" tipo="secondary" (acao)="limparFiltros()">Limpar</app-ks-button>
        <app-ks-button tamanho="small" tipo="primary" (acao)="pesquisar()">Pesquisar</app-ks-button>
      </div>
    </div>
  </div>


        <app-ks-table [loading]="carregando" storageKey="ordens-servico" [loadPage]="loadPage" (loadError)="erro = 'Nao foi possivel carregar os registros. Tente atualizar.'" (rowAction)="abrir($event)" emptyMessage="Nenhuma O.S encontrada.">
  <ng-template ksColumn="O.S" field="numeroOs" let-ordem>
    <div class="os-numero">{{ ordem.numeroOs }}</div>
  </ng-template>
  <ng-template ksColumn="Título" field="titulo" let-ordem>
    <div class="os-titulo">
                  <button type="button" (click)="abrir(ordem); $event.stopPropagation()">
                    {{ ordem.titulo }}
                  </button>
                </div>
  </ng-template>
  <ng-template ksColumn="Solicitante" field="solicitante" let-ordem>
    <div>{{ ordem.solicitante }}</div>
  </ng-template>
  <ng-template ksColumn="Criado por" field="criadoPor" let-ordem>
    <div>{{ ordem.criadoPor }}</div>
  </ng-template>
  <ng-template ksColumn="Responsável" field="responsavel" let-ordem>
    <div>{{ ordem.responsavel }}</div>
  </ng-template>
  <ng-template ksColumn="Setor" field="setor" let-ordem>
    <div>{{ ordem.setor }}</div>
  </ng-template>
  <ng-template ksColumn="Status" field="statusNome" let-ordem>
    <div>
                  <span class="status" [class]="statusClasse(ordem.statusNome)">
                    {{ ordem.statusNome || 'SEM STATUS' }}
                  </span>
                </div>
  </ng-template>
  <ng-template ksColumn="Criada em" field="criadoEmMs" let-ordem>
    <div class="os-data">{{ formatarData(ordem.criadoEmMs) }}</div>
  </ng-template>
  <ng-template ksColumn="Visualizar" [width]="82" let-ordem>
    <app-ks-grid-action tipo="visualizar" (acao)="abrir(ordem)"></app-ks-grid-action>
  </ng-template>
</app-ks-table>

</section>
